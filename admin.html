<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志管理 | PawBites 后台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <!-- 登录门：未登录或令牌失效时展示，遮住整个管理界面 -->
    <section class="admin-gate" id="adminGate" hidden>
      <div class="admin-gate-panel">
        <a class="brand admin-gate-brand" href="index.html" aria-label="PawBites 鲜宠小食">
          <span class="brand-mark">P</span>
          <span>PawBites 鲜宠小食</span>
        </a>
        <h1>日志管理后台</h1>
        <p class="admin-gate-message" id="gateMessage" role="status">该页面需要登录后访问。</p>
        <a class="admin-gate-link" href="index.html">返回商城首页登录</a>
      </div>
    </section>

    <div class="admin-shell" id="adminShell" hidden>
      <header class="admin-topbar">
        <a class="brand" href="index.html" aria-label="返回 PawBites 商城首页">
          <span class="brand-mark">P</span>
          <span>PawBites 鲜宠小食 · 后台</span>
        </a>
        <div class="admin-topbar-actions">
          <span class="admin-account" id="adminAccountName"></span>
          <a class="admin-back-link" href="index.html">返回商城</a>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-card" id="adminCard" aria-labelledby="adminPageTitle">
          <div class="admin-card-head">
            <h1 id="adminPageTitle">日志管理</h1>
            <p>维护更新日志与通知的发布状态，已发布的日志对用户端可见。</p>
          </div>

          <div class="admin-toolbar">
            <button class="admin-btn admin-btn-primary" id="createLogButton" type="button">+ 新增日志</button>
            <div class="admin-search">
              <input
                id="searchInput"
                type="text"
                placeholder="输入标题关键字搜索"
                maxlength="64"
                autocomplete="off"
                aria-label="按标题关键字搜索日志"
              />
              <button class="admin-btn admin-btn-primary" id="searchButton" type="button">搜索</button>
            </div>
          </div>

          <div class="admin-table-wrap" id="tableWrap">
            <table class="admin-table" id="logTable">
              <thead>
                <tr>
                  <th class="col-index" scope="col">序号</th>
                  <th class="cell-title" scope="col">标题</th>
                  <th class="col-type" scope="col">类型</th>
                  <th class="col-time" scope="col">时间</th>
                  <th class="col-status" scope="col">发布状态</th>
                  <th class="col-views" scope="col">点击量</th>
                  <th class="col-actions" scope="col">操作</th>
                </tr>
              </thead>
              <tbody id="logTableBody"></tbody>
            </table>
            <div class="admin-state" id="tableState" hidden></div>
          </div>

          <div class="admin-pagination" id="pagination" aria-label="日志分页"></div>
        </section>
      </main>
    </div>

    <!-- 新增/编辑日志弹窗 -->
    <div class="admin-modal" id="logModal" hidden aria-labelledby="logModalTitle">
      <div class="admin-modal-backdrop" data-close-modal="logModal"></div>
      <div class="admin-modal-panel" role="dialog" aria-modal="true" aria-labelledby="logModalTitle">
        <div class="admin-modal-head">
          <h2 id="logModalTitle">新增日志</h2>
          <button class="admin-modal-close" type="button" data-close-modal="logModal" aria-label="关闭弹窗">×</button>
        </div>
        <form class="admin-form" id="logForm" novalidate>
          <label class="admin-field">
            <span class="admin-field-label">标题<span class="admin-required">*</span></span>
            <input id="logTitleInput" name="title" type="text" maxlength="128" required placeholder="请输入日志标题" />
          </label>
          <label class="admin-field">
            <span class="admin-field-label">类型</span>
            <input
              id="logTypeInput"
              name="type"
              type="text"
              list="logTypeOptions"
              maxlength="64"
              placeholder="AI自习室通知"
            />
            <datalist id="logTypeOptions">
              <option value="AI自习室通知"></option>
              <option value="产品更新"></option>
              <option value="公告"></option>
            </datalist>
          </label>
          <label class="admin-field">
            <span class="admin-field-label">内容<span class="admin-required">*</span></span>
            <textarea id="logContentInput" name="content" rows="6" required placeholder="请输入日志内容"></textarea>
          </label>
          <p class="admin-form-message" id="logFormMessage" role="status" aria-live="polite"></p>
          <div class="admin-modal-foot">
            <button class="admin-btn admin-btn-plain" type="button" data-close-modal="logModal">取消</button>
            <button class="admin-btn admin-btn-primary" type="submit" id="logSubmitButton">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 删除二次确认弹窗 -->
    <div class="admin-modal" id="confirmModal" hidden aria-labelledby="confirmModalTitle">
      <div class="admin-modal-backdrop" data-close-modal="confirmModal"></div>
      <div class="admin-modal-panel admin-modal-panel-sm" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="admin-modal-head">
          <h2 id="confirmModalTitle">删除确认</h2>
          <button class="admin-modal-close" type="button" data-close-modal="confirmModal" aria-label="关闭弹窗">×</button>
        </div>
        <p class="admin-confirm-text">确定删除该日志吗？</p>
        <div class="admin-modal-foot">
          <button class="admin-btn admin-btn-plain" type="button" data-close-modal="confirmModal">取消</button>
          <button class="admin-btn admin-btn-danger" type="button" id="confirmDeleteButton">确定删除</button>
        </div>
      </div>
    </div>

    <div class="admin-toast" id="adminToast" role="status" aria-live="polite"></div>
    <script src="admin.js"></script>
  </body>
</html>
