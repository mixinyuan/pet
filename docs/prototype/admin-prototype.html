<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawBites 后台管理系统 · 交互原型 v0.1</title>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:#e9edf2;}</style>
</head>
<body>
<div id="pa-admin-proto">
<style>
#pa-admin-proto{
  --pa-primary:#409EFF; --pa-primary-d:#3375e0; --pa-danger:#F56C6C; --pa-success:#67C23A;
  --pa-warning:#E6A23C; --pa-info:#909399;
  --pa-text:#303133; --pa-text2:#606266; --pa-text3:#909399;
  --pa-border:#EBEEF5; --pa-border2:#DCDFE6;
  --pa-bg:#F5F7FA; --pa-card:#FFFFFF; --pa-side:#24303F; --pa-side-t:#A3B1C2;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--pa-text); font-size:14px; line-height:1.55; position:relative;
  background:var(--pa-bg); border-radius:8px; overflow:hidden;
}
#pa-admin-proto *,#pa-admin-proto *::before,#pa-admin-proto *::after{box-sizing:border-box;}
#pa-admin-proto button{font-family:inherit;}
#pa-admin-proto svg.lucide{width:15px;height:15px;flex:none;}
#pa-admin-proto [hidden]{display:none !important;}

/* ---------- 登录门 ---------- */
#pa-admin-proto .pa-gate{min-height:560px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#24303F 0%,#3a5f8a 60%,#409EFF 130%);}
#pa-admin-proto .pa-gate-card{width:380px;max-width:92%;background:#fff;border-radius:12px;padding:34px 34px 26px;box-shadow:0 18px 50px rgba(16,32,56,.35);}
#pa-admin-proto .pa-gate-logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px;font-size:21px;font-weight:600;color:var(--pa-text);}
#pa-admin-proto .pa-gate-logo svg.lucide{width:22px;height:22px;color:var(--pa-primary);}
#pa-admin-proto .pa-gate-sub{text-align:center;color:var(--pa-text3);font-size:12.5px;margin-bottom:24px;}

/* ---------- 主框架 ---------- */
#pa-admin-proto .pa-shell{display:flex;align-items:stretch;min-height:640px;}
#pa-admin-proto .pa-side{width:212px;flex:none;background:var(--pa-side);color:var(--pa-side-t);display:flex;flex-direction:column;padding:0 12px 14px;}
#pa-admin-proto .pa-brand{display:flex;align-items:center;gap:9px;padding:18px 10px 16px;color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.3px;}
#pa-admin-proto .pa-brand svg.lucide{width:19px;height:19px;color:var(--pa-primary);}
#pa-admin-proto .pa-brand small{font-weight:400;font-size:11px;color:var(--pa-side-t);margin-left:auto;letter-spacing:0;}
#pa-admin-proto .pa-nav{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
#pa-admin-proto .pa-nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:6px;background:transparent;color:var(--pa-side-t);font-size:13.5px;cursor:pointer;text-align:left;}
#pa-admin-proto .pa-nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
#pa-admin-proto .pa-nav-item.is-on{background:var(--pa-primary);color:#fff;}
#pa-admin-proto .pa-side-foot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:#8fa0b5;border-top:1px solid rgba(255,255,255,.08);}
#pa-admin-proto .pa-main{flex:1;min-width:0;display:flex;flex-direction:column;}
#pa-admin-proto .pa-topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--pa-border);padding:0 20px;height:52px;flex:none;}
#pa-admin-proto .pa-crumb{color:var(--pa-text3);font-size:13px;}
#pa-admin-proto .pa-crumb b{color:var(--pa-text);font-weight:500;}
#pa-admin-proto .pa-topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--pa-text2);}
#pa-admin-proto .pa-avatar{width:28px;height:28px;border-radius:50%;background:var(--pa-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
#pa-admin-proto .pa-content{padding:16px 20px 22px;flex:1;}

/* ---------- 卡片 / 工具栏 ---------- */
#pa-admin-proto .pa-card{background:var(--pa-card);border:1px solid var(--pa-border);border-radius:8px;padding:18px 20px;}
#pa-admin-proto .pa-card + .pa-card{margin-top:14px;}
#pa-admin-proto .pa-card-hd{margin-bottom:14px;}
#pa-admin-proto .pa-card-hd h2{margin:0;font-size:16px;font-weight:600;}
#pa-admin-proto .pa-card-hd p{margin:3px 0 0;color:var(--pa-text3);font-size:12.5px;}
#pa-admin-proto .pa-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
#pa-admin-proto .pa-toolbar .pa-sp{margin-left:auto;}
#pa-admin-proto .pa-kw{display:flex;align-items:center;}
#pa-admin-proto .pa-kw input{width:200px;height:30px;border:1px solid var(--pa-border2);border-right:0;border-radius:4px 0 0 4px;padding:0 10px;font-size:13px;outline:none;}
#pa-admin-proto .pa-kw input:focus{border-color:var(--pa-primary);}
#pa-admin-proto .pa-kw button{border-radius:0 4px 4px 0;}

/* ---------- 按钮 ---------- */
#pa-admin-proto .pa-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border:1px solid var(--pa-border2);border-radius:4px;background:#fff;color:var(--pa-text2);font-size:13px;cursor:pointer;white-space:nowrap;}
#pa-admin-proto .pa-btn:hover{color:var(--pa-primary);border-color:var(--pa-primary);}
#pa-admin-proto .pa-btn-pri{background:var(--pa-primary);border-color:var(--pa-primary);color:#fff;}
#pa-admin-proto .pa-btn-pri:hover{background:var(--pa-primary-d);border-color:var(--pa-primary-d);color:#fff;}
#pa-admin-proto .pa-btn-danger{background:var(--pa-danger);border-color:var(--pa-danger);color:#fff;}
#pa-admin-proto .pa-btn-danger:hover{background:#e25555;border-color:#e25555;color:#fff;}
#pa-admin-proto .pa-btn-block{width:100%;height:38px;font-size:14.5px;}
#pa-admin-proto .pa-linkbtn{border:0;background:none;padding:2px 4px;font-size:12.5px;color:var(--pa-primary);cursor:pointer;}
#pa-admin-proto .pa-linkbtn:hover{text-decoration:underline;}
#pa-admin-proto .pa-linkbtn.is-danger{color:var(--pa-danger);}
#pa-admin-proto .pa-linkbtn:disabled{color:var(--pa-text3);cursor:not-allowed;text-decoration:none;}
#pa-admin-proto .pa-iconbtn{border:0;background:none;padding:3px;border-radius:4px;color:var(--pa-text2);cursor:pointer;display:inline-flex;}
#pa-admin-proto .pa-iconbtn:hover{background:#f0f7ff;color:var(--pa-primary);}

/* ---------- 下拉 / 输入 ---------- */
#pa-admin-proto .pa-sel{height:30px;border:1px solid var(--pa-border2);border-radius:4px;background:#fff;color:var(--pa-text2);font-size:13px;padding:0 8px;outline:none;cursor:pointer;}
#pa-admin-proto .pa-sel:focus{border-color:var(--pa-primary);}
#pa-admin-proto .pa-date{height:30px;border:1px solid var(--pa-border2);border-radius:4px;padding:0 8px;font-size:12.5px;color:var(--pa-text2);outline:none;}

/* ---------- 表格 ---------- */
#pa-admin-proto .pa-tblwrap{overflow-x:auto;}
#pa-admin-proto table.pa-tbl{width:100%;border-collapse:collapse;font-size:13px;}
#pa-admin-proto .pa-tbl th{text-align:left;font-weight:500;color:var(--pa-text3);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--pa-border);white-space:nowrap;}
#pa-admin-proto .pa-tbl td{padding:10px;border-bottom:1px solid var(--pa-border);vertical-align:middle;}
#pa-admin-proto .pa-tbl tr:last-child td{border-bottom:0;}
#pa-admin-proto .pa-tbl tr:hover td{background:#f7fafd;}
#pa-admin-proto .pa-num{text-align:right;font-variant-numeric:tabular-nums;}
#pa-admin-proto .pa-ctr{text-align:center;}
#pa-admin-proto .pa-nowrap{white-space:nowrap;}
#pa-admin-proto .pa-empty td{text-align:center;color:var(--pa-text3);padding:34px 0 !important;font-size:13px;}
#pa-admin-proto .pa-cell-main{font-weight:500;color:var(--pa-text);}
#pa-admin-proto .pa-cell-sub{font-size:11.5px;color:var(--pa-text3);margin-top:1px;}
#pa-admin-proto .pa-prod{display:flex;align-items:center;gap:10px;min-width:200px;}
#pa-admin-proto .pa-thumb{width:38px;height:38px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:500;}
#pa-admin-proto .pa-thumb svg.lucide{width:16px;height:16px;color:rgba(255,255,255,.85);}
#pa-admin-proto .pa-mono{font-family:Consolas,Menlo,monospace;font-size:12.5px;}

/* ---------- 标签 / 状态 ---------- */
#pa-admin-proto .pa-pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-size:11.5px;line-height:1;white-space:nowrap;}
#pa-admin-proto .pa-pill + .pa-pill{margin-left:4px;}
#pa-admin-proto .p-blue{background:#ecf5ff;color:#409EFF;border:1px solid #d9ecff;}
#pa-admin-proto .p-gray{background:#f4f4f5;color:#909399;border:1px solid #e9e9eb;}
#pa-admin-proto .p-green{background:#f0f9eb;color:#67C23A;border:1px solid #e1f3d8;}
#pa-admin-proto .p-red{background:#fef0f0;color:#F56C6C;border:1px solid #fde2e2;}
#pa-admin-proto .p-orange{background:#fdf6ec;color:#E6A23C;border:1px solid #faecd8;}
#pa-admin-proto .p-teal{background:#f0f9f9;color:#3aa;margin:0 2px;border:1px solid #dcf0f0;}
#pa-admin-proto .pa-dim{color:var(--pa-text3);}
#pa-admin-proto .pa-lowstock{color:var(--pa-danger);font-weight:500;}
#pa-admin-proto .pa-stars{color:#E6A23C;font-size:12.5px;}

/* ---------- Switch ---------- */
#pa-admin-proto .pa-switch{width:36px;height:20px;border-radius:10px;border:none;background:#C0C4CC;position:relative;cursor:pointer;transition:background .2s;flex:none;vertical-align:middle;}
#pa-admin-proto .pa-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
#pa-admin-proto .pa-switch[aria-checked="true"]{background:var(--pa-success);}
#pa-admin-proto .pa-switch[aria-checked="true"]::after{left:18px;}
#pa-admin-proto .pa-switch.is-disabled{opacity:.5;cursor:not-allowed;}

/* ---------- 分页 ---------- */
#pa-admin-proto .pa-pager{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:var(--pa-text2);}
#pa-admin-proto .pa-pgbtn{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--pa-border2);border-radius:4px;background:#fff;color:var(--pa-text2);font-size:12.5px;cursor:pointer;}
#pa-admin-proto .pa-pgbtn:hover:not(:disabled){color:var(--pa-primary);border-color:var(--pa-primary);}
#pa-admin-proto .pa-pgbtn.is-on{background:var(--pa-primary);border-color:var(--pa-primary);color:#fff;}
#pa-admin-proto .pa-pgbtn:disabled{color:#c0c4cc;cursor:not-allowed;background:#f5f7fa;}
#pa-admin-proto .pa-pg-dots{color:var(--pa-text3);}
#pa-admin-proto .pa-pager .pa-total{margin-left:auto;}
#pa-admin-proto .pa-jump input{width:44px;height:28px;border:1px solid var(--pa-border2);border-radius:4px;text-align:center;font-size:12.5px;outline:none;margin:0 4px;}

/* ---------- 子标签页 ---------- */
#pa-admin-proto .pa-subtabs{display:flex;gap:2px;border-bottom:1px solid var(--pa-border);margin-bottom:16px;}
#pa-admin-proto .pa-subtab{border:0;background:none;padding:9px 16px;font-size:13.5px;color:var(--pa-text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
#pa-admin-proto .pa-subtab.is-on{color:var(--pa-primary);border-bottom-color:var(--pa-primary);font-weight:500;}

/* ---------- 看板 ---------- */
#pa-admin-proto .pa-statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
#pa-admin-proto .pa-stat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--pa-border);border-radius:8px;padding:18px;}
#pa-admin-proto .pa-stat-ico{width:44px;height:44px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;}
#pa-admin-proto .pa-stat-ico svg.lucide{width:20px;height:20px;color:#fff;}
#pa-admin-proto .pa-stat-label{font-size:12.5px;color:var(--pa-text3);}
#pa-admin-proto .pa-stat-value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;}
#pa-admin-proto .pa-stat-delta{font-size:11.5px;color:var(--pa-text3);}
#pa-admin-proto .pa-stat-delta b{font-weight:500;}
#pa-admin-proto .pa-up{color:var(--pa-success);} #pa-admin-proto .pa-down{color:var(--pa-danger);}
#pa-admin-proto .pa-rank{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--pa-border);font-size:13px;}
#pa-admin-proto .pa-rank:last-child{border-bottom:0;}
#pa-admin-proto .pa-rank-no{width:20px;height:20px;border-radius:4px;background:#f4f4f5;color:var(--pa-text3);font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}
#pa-admin-proto .pa-rank-no.top1{background:#fdf6ec;color:#E6A23C;} #pa-admin-proto .pa-rank-no.top2{background:#f4f4f5;color:#909399;} #pa-admin-proto .pa-rank-no.top3{background:#fdf6ec;color:#c78a5a;}
#pa-admin-proto .pa-clickrow{cursor:pointer;}
#pa-admin-proto .pa-clickrow:hover td{background:#f0f7ff !important;}

/* ---------- 弹窗 ---------- */
#pa-admin-proto .pa-overlay{position:absolute;inset:0;background:rgba(31,45,61,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 30px;}
#pa-admin-proto .pa-modal{background:#fff;border-radius:8px;width:640px;max-width:96%;max-height:calc(100% - 90px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);}
#pa-admin-proto .pa-modal.sm{width:420px;}
#pa-admin-proto .pa-modal.lg{width:760px;}
#pa-admin-proto .pa-modal-hd{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--pa-border);font-size:15.5px;font-weight:600;flex:none;}
#pa-admin-proto .pa-modal-hd .pa-x{margin-left:auto;}
#pa-admin-proto .pa-modal-bd{padding:18px 20px;overflow-y:auto;}
#pa-admin-proto .pa-modal-ft{display:flex;justify-content:flex-end;gap:10px;padding:13px 20px;border-top:1px solid var(--pa-border);flex:none;}
#pa-admin-proto .pa-form{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;}
#pa-admin-proto .pa-fi{display:flex;flex-direction:column;gap:5px;}
#pa-admin-proto .pa-fi.full{grid-column:1/-1;}
#pa-admin-proto .pa-fi label{font-size:12.5px;color:var(--pa-text2);}
#pa-admin-proto .pa-fi label .req{color:var(--pa-danger);margin-right:2px;}
#pa-admin-proto .pa-fi input,.pa-fi select,.pa-fi textarea{height:32px;border:1px solid var(--pa-border2);border-radius:4px;padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--pa-text);width:100%;}
#pa-admin-proto .pa-fi textarea{height:76px;padding:8px 10px;resize:vertical;font-family:inherit;line-height:1.5;}
#pa-admin-proto .pa-fi input:focus,.pa-fi select:focus,.pa-fi textarea:focus{border-color:var(--pa-primary);}
#pa-admin-proto .pa-fi .pa-hint{font-size:11.5px;color:var(--pa-text3);}
#pa-admin-proto .pa-chips{display:flex;flex-wrap:wrap;gap:7px;padding:7px 9px;border:1px solid var(--pa-border2);border-radius:4px;min-height:44px;background:#fff;}
#pa-admin-proto .pa-chip{border:1px solid var(--pa-border2);background:#fff;color:var(--pa-text2);border-radius:4px;padding:4px 10px;font-size:12.5px;cursor:pointer;}
#pa-admin-proto .pa-chip.is-on{background:#ecf5ff;border-color:var(--pa-primary);color:var(--pa-primary);}
#pa-admin-proto .pa-confirm-ico{width:44px;height:44px;border-radius:50%;background:#fef0f0;color:var(--pa-danger);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
#pa-admin-proto .pa-confirm-ico svg.lucide{width:22px;height:22px;}
#pa-admin-proto .pa-confirm-t{font-size:15.5px;font-weight:600;margin-bottom:6px;}
#pa-admin-proto .pa-confirm-m{font-size:13px;color:var(--pa-text2);}
#pa-admin-proto .pa-warnbanner{display:flex;gap:8px;align-items:flex-start;background:#fdf6ec;border:1px solid #faecd8;color:#b88230;border-radius:4px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;}

/* ---------- 套餐明细编辑器 ---------- */
#pa-admin-proto .pa-bi-tools{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
#pa-admin-proto .pa-bi-total{margin-left:auto;font-size:13px;color:var(--pa-text2);}
#pa-admin-proto .pa-bi-total b{color:var(--pa-text);font-variant-numeric:tabular-nums;}
#pa-admin-proto .pa-bi-tbl{width:100%;border-collapse:collapse;font-size:13px;}
#pa-admin-proto .pa-bi-tbl td,.pa-bi-tbl th{border:1px solid var(--pa-border);padding:7px 8px;text-align:left;font-weight:500;color:var(--pa-text3);font-size:12.5px;}
#pa-admin-proto .pa-bi-tbl select{width:100%;height:30px;border:1px solid var(--pa-border2);border-radius:4px;font-size:12.5px;padding:0 6px;background:#fff;color:var(--pa-text);outline:none;}
#pa-admin-proto .pa-step{display:inline-flex;align-items:center;border:1px solid var(--pa-border2);border-radius:4px;overflow:hidden;}
#pa-admin-proto .pa-step button{width:26px;height:28px;border:0;background:#f5f7fa;color:var(--pa-text2);font-size:14px;cursor:pointer;}
#pa-admin-proto .pa-step button:hover{color:var(--pa-primary);}
#pa-admin-proto .pa-step span{width:38px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}

/* ---------- 抽屉 ---------- */
#pa-admin-proto .pa-dwrap{position:absolute;inset:0;z-index:55;}
#pa-admin-proto .pa-dmask{position:absolute;inset:0;background:rgba(31,45,61,.35);}
#pa-admin-proto .pa-dpanel{position:absolute;top:0;right:0;bottom:0;width:470px;max-width:92%;background:#fff;box-shadow:-8px 0 26px rgba(0,0,0,.14);display:flex;flex-direction:column;animation:pa-in .22s ease;}
@keyframes pa-in{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
#pa-admin-proto .pa-dhd{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--pa-border);font-size:15.5px;font-weight:600;}
#pa-admin-proto .pa-dbd{padding:16px 20px;overflow-y:auto;}
#pa-admin-proto .pa-dsec{margin-bottom:18px;}
#pa-admin-proto .pa-dsec h4{margin:0 0 8px;font-size:13px;color:var(--pa-text3);font-weight:500;letter-spacing:.5px;}
#pa-admin-proto .pa-kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:13px;}
#pa-admin-proto .pa-kv dt{color:var(--pa-text3);} #pa-admin-proto .pa-kv dd{margin:0;}
#pa-admin-proto .pa-mini-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--pa-border);font-size:12.5px;}

/* ---------- toast ---------- */
#pa-admin-proto .pa-toasts{position:absolute;top:14px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px;}
#pa-admin-proto .pa-toast{display:flex;align-items:center;gap:8px;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.16);padding:10px 14px;font-size:13px;color:var(--pa-text);border-left:3px solid var(--pa-primary);animation:pa-tin .25s ease;max-width:340px;}
@keyframes pa-tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#pa-admin-proto .pa-toast.ok{border-left-color:var(--pa-success);} #pa-admin-proto .pa-toast.ok svg.lucide{color:var(--pa-success);}
#pa-admin-proto .pa-toast.err{border-left-color:var(--pa-danger);} #pa-admin-proto .pa-toast.err svg.lucide{color:var(--pa-danger);}
#pa-admin-proto .pa-toast.warn{border-left-color:var(--pa-warning);} #pa-admin-proto .pa-toast.warn svg.lucide{color:var(--pa-warning);}

@media (max-width:760px){
  #pa-admin-proto .pa-shell{flex-direction:column;}
  #pa-admin-proto .pa-side{width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:0 10px;}
  #pa-admin-proto .pa-brand{padding:12px 10px;flex:none;}
  #pa-admin-proto .pa-brand small{display:none;}
  #pa-admin-proto .pa-nav{flex-direction:row;margin:0;}
  #pa-admin-proto .pa-side-foot{display:none;}
  #pa-admin-proto .pa-form{grid-template-columns:1fr;}
}
</style>

<!-- ============ 登录门 ============ -->
<div class="pa-gate" id="paGate">
  <div class="pa-gate-card">
    <div class="pa-gate-logo"><i data-lucide="paw-print"></i>PawBites 管理后台</div>

    parts.push('<button class="pa-pgbtn" data-action="page" data-scope="'+scope+'" data-p="prev" '+(page<=1?"disabled":"")+'>‹</button>');
    var nums=[];
    if(totalPages<=7){ for(var i=1;i<=totalPages;i++) nums.push(i); }
    else{ nums.push(1); if(page>3)nums.push("..."); for(var j=Math.max(2,page-1);j<=Math.min(totalPages-1,page+1);j++)nums.push(j); if(page<totalPages-2)nums.push("..."); nums.push(totalPages); }
    nums.forEach(function(n){
      if(n==="...") parts.push('<span class="pa-pg-dots">…</span>');
      else parts.push('<button class="pa-pgbtn'+(n===page?" is-on":"")+'" data-action="page" data-scope="'+scope+'" data-p="'+n+'">'+n+"</button>");
    });
    parts.push('<button class="pa-pgbtn" data-action="page" data-scope="'+scope+'" data-p="next" '+(page>=totalPages?"disabled":"")+'>›</button>');
    parts.push('<span class="pa-jump">前往<input id="jump-'+scope+'" value="'+page+'">页 <button class="pa-pgbtn" data-action="jump" data-scope="'+scope+'">GO</button></span>');
    parts.push('<span class="pa-total">共 '+total+" 条记录</span>");
    return '<div class="pa-pager">'+parts.join("")+"</div>";
  }

      '<button class="pa-btn" data-action="modal-close">取消</button><button class="pa-btn pa-btn-pri" data-action="form-submit" data-kind="coupon">'+(c?"保存修改":"创建模板")+"</button>");
  }
  function logModal(l){
    showModal("",l?"编辑日志":"新增日志",
      '<div class="pa-form">'+
        fi("标题","ltitle",l?l.title:"","",true)+
        '<div class="pa-fi"><label><span class="req">*</span>类型</label><input id="f-ltype" list="paTypes" value="'+esc(l?l.type:"AI自习室通知")+'"><datalist id="paTypes"><option>AI自习室通知</option><option>版本更新</option><option>运营公告</option></datalist></div>'+
        '<div class="pa-fi full"><label><span class="req">*</span>内容</label><textarea id="f-lcontent">'+esc(l?l.content:"")+"</textarea></div>"+

        fi("排序号","csort",c?c.sort:0,"",false,"number")+
      "</div>",

      '<button class="pa-btn" data-action="modal-close">取消</button><button class="pa-btn pa-btn-pri" data-action="form-submit" data-kind="tag">保存</button>');

  /* ================= 表单提交 ================= */
  function val(id){ var e=$("f-"+id); return e?e.value.trim():""; }
  function num(id){ return parseFloat(val(id)); }
  function formSubmit(kind){
    if(kind==="product"){
      var sku=val("sku").toUpperCase(),name=val("name"),flavor=val("flavor"),img=val("img");
      var price=num("price"),stock=parseInt(val("stock"),10),rating=num("rating");
      if(!sku||!name||!flavor||!img) return toast("请填写完整必填项（SKU/名称/口味/图片 URL）","err");
      if(!(price>0)) return toast("价格必须大于 0","err");
      if(isNaN(stock)||stock<0) return toast("库存须为 ≥ 0 的整数","err");
      if(editCtx.cats.size<1) return toast("请至少选择 1 个分类","err");
      var dup=PRODUCTS.find(function(p){return p.sku===sku&&p.id!==editCtx.id;});
      if(dup) return toast("SKU 已存在："+dup.sku,"err");
      var data={sku:sku,name:name,pet:val("pet"),flavor:flavor,price:price,stock:stock,rating:isNaN(rating)?5:Math.min(5,Math.max(0,rating)),status:val("status"),cats:Array.from(editCtx.cats),tags:Array.from(editCtx.tags),desc:val("desc")};
      if(editCtx.id){ var p=prod(editCtx.id); Object.assign(p,data); toast("商品「"+name+"」已保存"); }
      else{ PRODUCTS.push(Object.assign({id:PRODUCTS.length+1},data)); toast("商品「"+name+"」已创建"); }
    }
    if(kind==="bundle"){
      var bname=val("bname"),bprice=num("bprice"),borig=num("borig");
      if(!bname) return toast("请填写套餐名称","err");
      if(!(bprice>0)) return toast("现价必须大于 0","err");
      if(!(borig>=bprice)) return toast("原价应不低于现价","err");
      if(!editCtx.items.length) return toast("请至少添加 1 行商品明细","err");
      var bdata={name:bname,price:bprice,orig:borig,label:val("blabel"),sort:parseInt(val("bsort")||"0",10),status:val("bstatus"),desc:val("bdesc"),items:editCtx.items.slice()};
      if(editCtx.id){ var b=null; BUNDLES.forEach(function(x){if(x.id===editCtx.id)b=x;}); Object.assign(b,bdata); toast("套餐「"+bname+"」已保存"); }
      else{ BUNDLES.push(Object.assign({id:BUNDLES.length+1},bdata)); toast("套餐「"+bname+"」已创建"); }
    }
    if(kind==="review"){
      if(!val("vbuyer")||!val("vcontent")) return toast("评价人与内容为必填","err");
      var rdata={buyer:val("vbuyer"),pet:val("vpet"),breed:val("vbreed"),content:val("vcontent"),pid:val("vpid")?+val("vpid"):null,rating:Math.min(5,Math.max(0,num("vrating")||4.8)),sort:parseInt(val("vsort")||"0",10),status:val("vstatus"),at:"2026-11-05"};
      if(editCtx&&editCtx.kind==="review"){ /* not used */ }
      var editingReviewId=editCtx?editCtx.rid:null;
      if(editingReviewId){ var r=null; REVIEWS.forEach(function(x){if(x.id===editingReviewId)r=x;}); Object.assign(r,rdata); toast("评价已保存"); }
      else{ REVIEWS.unshift(Object.assign({id:Date.now()%100000},rdata)); toast("评价已创建"); }
    }
    if(kind==="coupon"){
      if(!val("cname")) return toast("请填写券名称","err");
      if(!(num("camount")>0)) return toast("面额必须大于 0","err");
      if(!(num("cmin")>=0)) return toast("门槛须 ≥ 0","err");
      if(!(parseInt(val("cdays"),10)>0)) return toast("有效天数须大于 0","err");
      var cdata={name:val("cname"),amount:num("camount"),min:num("cmin"),days:parseInt(val("cdays"),10),remark:val("cremark")};
      if(editCtx.id){ var c=null; COUPONS.forEach(function(x){if(x.id===editCtx.id)c=x;}); Object.assign(c,cdata); toast("模板已保存"); }
      else{ COUPONS.push(Object.assign({id:COUPONS.length+1,issued:0,used:0,status:"ACTIVE"},cdata)); toast("模板已创建，将按发放规则自动发放"); }
    }
    if(kind==="log"){
      if(!val("ltitle")||!val("lcontent")) return toast("标题与内容为必填","err");
      var ldata={title:val("ltitle"),type:val("ltype")||"AI自习室通知",content:val("lcontent")};
      if(editCtx.id){ var l=null; LOGS.forEach(function(x){if(x.id===editCtx.id)l=x;}); Object.assign(l,ldata); toast("日志已保存"); }
      else{ LOGS.unshift(Object.assign({id:LOGS.length+1,status:0,views:0,at:"2026-11-05 10:00"},ldata)); toast("日志已创建（默认未发布）"); }
    }
    if(kind==="cat"){
      var code=val("ccode").toLowerCase();
      if(!code||!val("cname2")) return toast("编码与名称为必填","err");
      if(!/^[a-z]+$/.test(code)) return toast("编码仅限小写字母","err");
      var dupc=CATS.find(function(c){return c.code===code&&c.code!==editCtx.code;});
      if(dupc) return toast("编码已存在","err");
      if(editCtx.code){ var cc=null; CATS.forEach(function(x){if(x.code===editCtx.code)cc=x;}); var old=cc.code; cc.code=code; cc.name=val("cname2"); cc.desc=val("cdesc"); cc.sort=parseInt(val("csort")||"0",10); if(old!==code){ PRODUCTS.forEach(function(p){ p.cats=p.cats.map(function(x){return x===old?code:x;}); }); } toast("分类已保存"); }
      else{ CATS.push({code:code,name:val("cname2"),desc:val("cdesc"),sort:parseInt(val("csort")||"0",10)}); toast("分类已创建"); }
    }
    if(kind==="tag"){
      if(!val("tname")) return toast("请填写标签名称","err");
      var dupt=TAGS.find(function(t){return t.name===val("tname")&&t.id!==editCtx.id;});
      if(dupt) return toast("标签名已存在","err");
      if(editCtx.id){ var tt=null; TAGS.forEach(function(x){if(x.id===editCtx.id)tt=x;}); tt.name=val("tname"); toast("标签已保存"); }
      else{ TAGS.push({id:TAGS.length+1,name:val("tname")}); toast("标签已创建"); }
    }
    closeModal(); render();
  }

  /* ================= 渲染入口 ================= */
  var TITLES={dashboard:"数据看板",products:"商品管理",bundles:"场景套餐管理",orders:"订单管理",users:"用户管理",reviews:"评价管理",coupons:"优惠券管理",logs:"日志管理"};
  function render(){
    crumbEl.innerHTML="首页 / <b>"+(TITLES[state.view]||"")+"</b>";
    if(state.view==="dashboard") renderDashboard();
    else if(state.view==="products") renderProducts();
    else if(state.view==="bundles") renderBundles();
    else if(state.view==="orders") renderOrders();
    else if(state.view==="users") renderUsers();
    else if(state.view==="reviews") renderReviews();
    else if(state.view==="coupons") renderCoupons();
    else renderLogs();
    refreshIcons();
  }

  /* ================= 事件 ================= */
  root.addEventListener("submit",function(e){ if(e.target&&e.target.id==="paLoginForm"){ e.preventDefault(); doLogin(); } });
  function doLogin(){
    if(!$("paLoginUser").value.trim()){ toast("请输入账号","err"); return; }
    state.loggedIn=true; saveW();
    gate.hidden=true; shell.hidden=false;
    renderNav(); render(); toast("欢迎回来，管理员");
  }
  root.addEventListener("input",function(e){
    var t=e.target;
    if(t&&t.classList&&t.classList.contains("pa-kw-inp")){ ui[t.dataset.scope].q=t.value; }
  });
  root.addEventListener("change",function(e){
    var t=e.target, f=t&&t.dataset?t.dataset.filter:null;
    if(!f) return;
    if(f==="p-cat"){ ui.products.cat=t.value; ui.products.page=1; }
    if(f==="p-status"){ ui.products.status=t.value; ui.products.page=1; }
    if(f==="b-status"){ ui.bundles.status=t.value; ui.bundles.page=1; }
    if(f==="o-status"){ ui.orders.status=t.value; ui.orders.page=1; }
    if(f==="u-status"){ ui.users.status=t.value; ui.users.page=1; }
    if(f==="r-status"){ ui.reviews.status=t.value; ui.reviews.page=1; }
    if(f==="o-from"){ ui.orders.from=t.value; ui.orders.page=1; }
    if(f==="o-to"){ ui.orders.to=t.value; ui.orders.page=1; }
    if(t.dataset.bi!==undefined&&editCtx){ editCtx.items[+t.dataset.bi].pid=+t.value; var box=$("paBiBox"); if(box){ box.innerHTML=biBoxHtml(); refreshIcons(); } }
    render();
  });
  root.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ if(!overlay.hidden) closeModal(); else if(!drawerEl.hidden) drawerEl.hidden=true; return; }
    if(e.key==="Enter"&&e.target&&e.target.classList&&e.target.classList.contains("pa-kw-inp")){
      ui[e.target.dataset.scope].page=1; render();
    }
  });
  root.addEventListener("click",function(e){
    var t=e.target.closest("[data-action]");
    if(!t) return;
    var a=t.dataset.action, id=t.dataset.id?+t.dataset.id:null;
    if(a!=="chip"&&a!=="bi-qty"&&a!=="bi-del"&&a!=="bi-add"&&a!=="bi-fill"){ /* ok */ }
    switch(a){
      case "login": break;
      case "demo": toast("原型演示：此处跳转商城首页 index.html","warn"); break;
      case "logout": state.loggedIn=false; saveW(); closeModal(); drawerEl.hidden=true; shell.hidden=true; gate.hidden=false; break;
      case "nav": nav(t.dataset.view); break;
      case "subtab": ui.products.subtab=t.dataset.tab; render(); break;
      case "search": { var sc=t.dataset.scope; ui[sc].page=1; render(); break; }
      case "page": {
        var sc2=t.dataset.scope, p=t.dataset.p, u2=ui[sc2];
        var tot=root.querySelectorAll('.pa-pgbtn[data-action="page"][data-scope="'+sc2+'"]').length;
        if(p==="prev") u2.page=Math.max(1,u2.page-1);
        else if(p==="next") u2.page=u2.page+1;
        else u2.page=Math.min(999,Math.max(1,+p));
        render(); break;
      }
      case "jump": {
        var sc3=t.dataset.scope, inp=$("jump-"+sc3), v=parseInt(inp&&inp.value,10);
        if(!isNaN(v)){ ui[sc3].page=Math.max(1,v); render(); }
        break;
      }
      case "modal-close": closeModal(); break;
      case "drawer-close": drawerEl.hidden=true; break;
      case "confirm-ok": { var fn=onConfirmOk; onConfirmOk=null; closeModal(); if(fn) fn(); break; }
      case "goto-order": { ui.orders.q=t.dataset.no; ui.orders.status="all"; nav("orders"); toast("已按订单号定位："+t.dataset.no,"warn"); break; }
      case "restock": { ui.products.subtab="list"; ui.products.q=""; nav("products"); var rp=prod(+t.dataset.id); productModal(rp); break; }
      /* ---- 弹窗表单 ---- */
      case "new":
        if(t.dataset.kind==="product") productModal(null);
        if(t.dataset.kind==="bundle") bundleModal(null);
        if(t.dataset.kind==="review"){ editCtx={kind:"review",rid:null}; reviewModal(null); }
        if(t.dataset.kind==="coupon"){ editCtx={kind:"coupon",id:null}; couponModal(null); }
        if(t.dataset.kind==="log"){ editCtx={kind:"log",id:null}; logModal(null); }
        if(t.dataset.kind==="cat") catModal(null);
        if(t.dataset.kind==="tag") tagModal(null);
        break;
      case "edit":
        if(t.dataset.kind==="product") productModal(prod(id));
        if(t.dataset.kind==="bundle"){ var eb=null; BUNDLES.forEach(function(x){if(x.id===id)eb=x;}); bundleModal(eb); }
        if(t.dataset.kind==="review"){ var er=null; REVIEWS.forEach(function(x){if(x.id===id)er=x;}); editCtx={kind:"review",rid:id}; reviewModal(er); }
        if(t.dataset.kind==="coupon"){ var ec=null; COUPONS.forEach(function(x){if(x.id===id)ec=x;}); editCtx={kind:"coupon",id:id}; couponModal(ec); }
        if(t.dataset.kind==="log"){ var el2=null; LOGS.forEach(function(x){if(x.id===id)el2=x;}); editCtx={kind:"log",id:id}; logModal(el2); }
        if(t.dataset.kind==="cat"){ var ecat=null; CATS.forEach(function(x){if(x.code===t.dataset.code)ecat=x;}); catModal(ecat); }
        if(t.dataset.kind==="tag"){ var etg=null; TAGS.forEach(function(x){if(x.id===id)etg=x;}); tagModal(etg); }
        break;
      case "form-submit": formSubmit(t.dataset.kind); break;
      case "chip": {
        var v=t.dataset.v, g=t.dataset.g;
        var set=g==="cats"?editCtx.cats:editCtx.tags;
        if(set.has(isNaN(+v)?v:+v)) set.delete(isNaN(+v)?v:+v); else set.add(isNaN(+v)?v:+v);
        t.classList.toggle("is-on"); break;
      }
      /* ---- 套餐明细 ---- */
      case "bi-add": {
        var avail=PRODUCTS.filter(function(p){return p.status==="ACTIVE"&&!editCtx.items.some(function(it){return it.pid===p.id;});});
        if(!avail.length){ toast("没有更多可添加的上架商品","warn"); break; }
        editCtx.items.push({pid:avail[0].id,qty:1});
        $("paBiBox").innerHTML=biBoxHtml(); refreshIcons(); break;
      }
      case "bi-del": editCtx.items.splice(+t.dataset.i,1); $("paBiBox").innerHTML=biBoxHtml(); refreshIcons(); break;
      case "bi-qty": {
        var it=editCtx.items[+t.dataset.i]; it.qty=Math.min(99,Math.max(1,it.qty+ +t.dataset.d));
        $("paBiBox").innerHTML=biBoxHtml(); refreshIcons(); break;
      }
      case "bi-fill": { var tt2=0; editCtx.items.forEach(function(x){tt2+=prod(x.pid).price*x.qty;}); var oi=$("f-borig"); if(oi){ oi.value=tt2.toFixed(2); toast("已将明细合计 "+money(tt2)+" 填入原价"); } break; }
      /* ---- 订单 ---- */
      case "order-detail": { var od=null; ORDERS.forEach(function(x){if(x.id===id)od=x;}); orderDetailModal(od); break; }
      case "order-cancel": {
        var oc=null; ORDERS.forEach(function(x){if(x.id===id)oc=x;});
        if(!oc||oc.status!=="CREATED") break;
        confirmBox("取消订单 "+oc.no+"？","取消后不可恢复；将自动<strong>回补商品库存</strong>"+(oc.coupon?"并<strong>退还用户优惠券「"+esc(oc.coupon.name)+"」</strong>":"")+"。","确认取消",function(){
          oc.status="CANCELLED"; oc.cancelAt="2026-11-05 10:30"; oc.cancelBy="ADMIN";
          oc.items.forEach(function(x){ prod(x.pid).stock+=x.qty; });
          toast("订单已取消：库存已回补"+(oc.coupon?"、优惠券已退还":""));
          render();
        });
        break;
      }
      /* ---- 用户 ---- */
      case "user-detail": { var uu=null; USERS.forEach(function(x){if(x.id===id)uu=x;}); userDrawer(uu); break; }
      case "user-disable": {
        var ud=null; USERS.forEach(function(x){if(x.id===id)ud=x;});
        confirmBox("禁用账号「"+esc(ud.nickname)+"」？","禁用后该用户无法登录与下单，数据与订单保留；已签发的登录凭证在过期前仍有效（需求文档 Q3）。","确认禁用",function(){ ud.status="INACTIVE"; toast("账号已禁用"); render(); });
        break;
      }
      case "user-enable": { var ue=null; USERS.forEach(function(x){if(x.id===id)ue=x;}); ue.status="ACTIVE"; toast("账号已启用"); render(); break; }
      /* ---- 开关 ---- */
      case "sw-product": { var sp=prod(id); sp.status=sp.status==="ACTIVE"?"INACTIVE":"ACTIVE"; t.setAttribute("aria-checked",sp.status==="ACTIVE"?"true":"false"); toast("商品「"+sp.name+"」"+(sp.status==="ACTIVE"?"已上架":"已下架，C 端将不再展示")); render(); break; }
      case "sw-bundle": { var sb=null; BUNDLES.forEach(function(x){if(x.id===id)sb=x;}); sb.status=sb.status==="ACTIVE"?"INACTIVE":"ACTIVE"; t.setAttribute("aria-checked",sb.status==="ACTIVE"?"true":"false"); toast("套餐「"+sb.name+"」"+(sb.status==="ACTIVE"?"已上架":"已下架")); render(); break; }
      case "sw-review": { var sr=null; REVIEWS.forEach(function(x){if(x.id===id)sr=x;}); sr.status=sr.status==="ACTIVE"?"INACTIVE":"ACTIVE"; t.setAttribute("aria-checked",sr.status==="ACTIVE"?"true":"false"); toast("评价已"+(sr.status==="ACTIVE"?"展示":"隐藏")); render(); break; }
      case "sw-coupon": { var sc4=null; COUPONS.forEach(function(x){if(x.id===id)sc4=x;}); sc4.status=sc4.status==="ACTIVE"?"INACTIVE":"ACTIVE"; t.setAttribute("aria-checked",sc4.status==="ACTIVE"?"true":"false"); toast("模板已"+(sc4.status==="ACTIVE"?"启用，将自动发放":"停用，不再自动发放")); render(); break; }
      case "sw-log": { var sl=null; LOGS.forEach(function(x){if(x.id===id)sl=x;}); sl.status=sl.status===1?0:1; t.setAttribute("aria-checked",sl.status===1?"true":"false"); toast(sl.status===1?"已发布":"已下架"); render(); break; }
      /* ---- 删除 ---- */
      case "del": {
        var k=t.dataset.kind;
        if(k==="product"){
          var dp=prod(id);
          var inB=BUNDLES.filter(function(b){return b.items.some(function(x){return x.pid===id;});});
          if(inB.length){ toast("该商品被 "+inB.length+" 个套餐引用（"+inB.map(function(b){return b.name;}).join("、")+"），请先从套餐中移除","warn"); break; }
          confirmBox("删除商品「"+esc(dp.name)+"」？","逻辑删除，历史订单快照不受影响；C 端立即不可见。","确认删除",function(){ dp.status="INACTIVE"; PRODUCTS=PRODUCTS.filter(function(x){return x.id!==id;}); toast("商品已删除"); render(); });
        }
        if(k==="bundle"){ var db=null; BUNDLES.forEach(function(x){if(x.id===id)db=x;}); var nm=db.name; confirmBox("删除套餐「"+esc(nm)+"」？","删除后 C 端套餐区立即不再展示。","确认删除",function(){ BUNDLES=BUNDLES.filter(function(x){return x.id!==id;}); toast("套餐已删除"); render(); }); }
        if(k==="review"){ confirmBox("删除这条评价？","逻辑删除，可由数据库管理员恢复。","确认删除",function(){ REVIEWS=REVIEWS.filter(function(x){return x.id!==id;}); toast("评价已删除"); render(); }); }
        if(k==="log"){ confirmBox("删除这条日志？","物理删除，不可恢复。","确认删除",function(){ LOGS=LOGS.filter(function(x){return x.id!==id;}); toast("日志已删除"); if(!LOGS.length) ui.logs.page=1; render(); }); }
        if(k==="coupon"){ var dc=null; COUPONS.forEach(function(x){if(x.id===id)dc=x;}); if(dc.issued>0){ toast("该券已发放 "+dc.issued+" 张，仅支持停用","warn"); break; } confirmBox("删除模板「"+esc(dc.name)+"」？","尚未发放，可安全删除。","确认删除",function(){ COUPONS=COUPONS.filter(function(x){return x.id!==id;}); toast("模板已删除"); render(); }); }
        if(k==="cat"){ var code2=t.dataset.code; var ref=PRODUCTS.filter(function(p){return p.cats.indexOf(code2)>-1;}).length; if(ref){ toast("该分类被 "+ref+" 个商品引用，不可删除","warn"); break; } confirmBox("删除该分类？","删除后不可恢复。","确认删除",function(){ CATS=CATS.filter(function(x){return x.code!==code2;}); toast("分类已删除"); render(); }); }
        if(k==="tag"){ var tid=id; TAGS=TAGS.filter(function(x){return x.id!==tid;}); PRODUCTS.forEach(function(p){ p.tags=p.tags.filter(function(x){return x!==tid;}); }); toast("标签已删除"); render(); }
        break;
      }
    }
  });
  overlay.addEventListener("mousedown",function(e){ if(e.target===overlay) closeModal(); });

  /* ================= 初始化 ================= */
  (function init(){
    var z=window.zcode, saved=null;
    try{ if(z&&z.widgetState&&z.widgetState.privateContent) saved=JSON.parse(z.widgetState.privateContent); }catch(err){}
    if(saved&&saved.l){
      state.loggedIn=true;
      if(saved.v&&TITLES[saved.v]) state.view=saved.v;
      gate.hidden=true; shell.hidden=false;
    }
    renderNav(); render();
  })();
})();
</script>
